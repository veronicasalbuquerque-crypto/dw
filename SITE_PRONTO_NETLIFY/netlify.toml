[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/create-pix"
  to = "/.netlify/functions/create-pix"
  status = 200

[[redirects]]
  from = "/api/check-status/:id"
  to = "/.netlify/functions/check-status?id=:id"
  status = 200

[[redirects]]
  from = "/flor/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/flor"
  to = "/"
  status = 301
